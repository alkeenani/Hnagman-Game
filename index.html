<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="main.css" />
    <title>Hangman</title>
  </head>
  <body>
    <div class="game-container">
      <div class="userProfile">
        <div class="imge">
          <img src="./img/avatar-05.webp" alt="" id="preview" />
          <span class="uploadIcon"><i class="fa-solid fa-upload"></i></span>
          <input type="file" id="imageInput" accept="image/*" />
        </div>
        <span class="RateWin">0</span>
        <span class="RateLose">0</span>
      </div>

      <header>
        <div class="heading">Hangman</div>
        <div>Word Form : <span class="Categorie"></span></div>
      </header>
      <hr />
      <div class="row">
        <div class="Hangman-draw">
          <div class="the-draw">
            <div class="the-stand"></div>
            <div class="the-hang"></div>
            <div class="the-rowp"></div>
            <div class="the-man">
              <div class="the-head"></div>
              <div class="the-body"></div>
              <div class="the-hand"></div>
              <div class="the-leg"></div>
            </div>
          </div>
        </div>
        <div class="latters"></div>
      </div>
      <hr />
      <div class="input-feild"></div>
      <hr />
      <button type="button" class="newGame">New Game</button>
    </div>

    <audio src="./src/success.mp3" id="success" preload="auto"></audio>
    <audio src="./src/fail.mp3" id="fail" preload="auto"></audio>
    <audio src="./src/Game_Over.mp3" preload="auto" id="gameOver"></audio>
    <audio src="./src/Victory_Sound.mp4" preload="auto" id="Win"></audio>
    <script src="main.js"></script>
  </body>
</html>
